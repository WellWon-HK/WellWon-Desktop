[package]
name = "wellwon-desktop"
version = "0.1.9"
description = "WellWon Desktop"
authors = ["Eduard"]
edition = "2021"

[lib]
name = "wellwon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-dialog = "2.0"
# Direct dep so we can use tokio::time::sleep in the updater poll loop.
# tauri pulls tokio transitively but without the `time` feature.
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used to set NSWindowCollectionBehaviorMoveToActiveSpace on the main
# window — Tauri 2's builder doesn't expose this flag directly, but
# macOS needs it for Spotlight-style "window jumps to the active Space
# when summoned by hotkey, instead of dragging the user to the Space
# where it was opened."
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
